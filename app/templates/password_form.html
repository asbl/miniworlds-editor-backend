<details class="panel">
  <summary>Passwort ändern</summary>
  <form id="password-form">
    <label>Aktuelles Passwort <input type="password" name="current_password" required autocomplete="current-password"></label>
    <label>Neues Passwort (min. 8 Zeichen) <input type="password" name="new_password" required minlength="8" autocomplete="new-password"></label>
    <button type="submit">Ändern</button>
    <p id="password-status" role="status"></p>
  </form>
</details>
